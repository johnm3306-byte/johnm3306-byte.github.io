<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Johnmark Ochieng logo">
  <defs>
    <linearGradient id="mp-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6b2c"/>
    </linearGradient>
    <clipPath id="mp-front"><rect x="0" y="17" width="48" height="31"/></clipPath>
  </defs>
  <!-- back half of the ring -->
  <ellipse cx="24" cy="17" rx="19" ry="5.5" fill="none" stroke="#7c6cff" stroke-width="2.2" transform="rotate(-16 24 17)"/>
  <!-- mic capsule as a planet -->
  <rect x="16.5" y="4" width="15" height="25" rx="7.5" fill="url(#mp-g)"/>
  <path d="M19.5 12h9M19.5 16.5h9M19.5 21h9" stroke="#140700" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
  <!-- front half of the ring, over the capsule -->
  <g clip-path="url(#mp-front)">
    <ellipse cx="24" cy="17" rx="19" ry="5.5" fill="none" stroke="#7c6cff" stroke-width="2.2" transform="rotate(-16 24 17)"/>
  </g>
  <circle cx="41.2" cy="12.4" r="2.4" fill="currentColor"/>
  <!-- cradle + stand -->
  <path d="M11.5 23.5a12.5 12.5 0 0 0 25 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M24 36v7M17.5 44h13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
</svg>
